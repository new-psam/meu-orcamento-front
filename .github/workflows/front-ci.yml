name: Frontend CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Instalar dependencias
        run: npm ci

      - name: Rodar o Linter
        run: npm run lint

      - name: Rodar testes
        run: npm run test

      - name: Buildar o PRojeto
        run: npm run build
